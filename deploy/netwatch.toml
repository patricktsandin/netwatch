# netwatch configuration. These are the built-in defaults (ADR-0009); the daemon
# reads /etc/netwatch/netwatch.toml, or the file named by NETWATCH_CONFIG, instead.
#
# Every target needs a stable `id`: history is keyed by it, so never renumber a
# target, and never reuse the id of one you removed.

listen = "127.0.0.1:8732"
database = "netwatch.db"

# ICMP echo, plus hops 1-3 toward it.
[[target]]
id = 1
icmp = "1.1.1.1"
[[target]]
id = 2
icmp = "8.8.8.8"
[[target]]
id = 3
icmp = "9.9.9.9"
[[target]]
id = 4
icmp = "2606:4700:4700::1111"
[[target]]
id = 5
icmp = "2001:4860:4860::8888"
[[target]]
id = 6
icmp = "2620:fe::fe"

# DNS: `. IN NS` to this server (ADR-0027).
[[target]]
id = 11
dns = "1.1.1.1"
[[target]]
id = 12
dns = "8.8.8.8"
[[target]]
id = 13
dns = "9.9.9.9"
# The resolver this host actually uses (the first non-loopback upstream).
[[target]]
id = 14
dns = "system"

# HTTPS, which must answer with `expect_status` (and contain `expect_body`, if
# given). A captive portal's 200 is a failure (ADR-0028).
[[target]]
id = 21
https = "https://www.gstatic.com/generate_204"
expect_status = 204
[[target]]
id = 22
https = "https://cp.cloudflare.com/generate_204"
expect_status = 204
[[target]]
id = 23
https = "https://one.one.one.one/cdn-cgi/trace"
expect_status = 200
expect_body = "colo="
